<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    
    <radialGradient id="tealGlow" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 58px; letter-spacing: -1.5px; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 1.5px; fill: #38bdf8; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #e2e8f0; }
    .node-pulse { animation: pulse 3s infinite ease-in-out; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="16" fill="url(#tealGlow)"/>
  <rect width="1200" height="380" rx="16" fill="url(#purpleGlow)"/>
  <rect width="1200" height="380" rx="16" fill="url(#blueGlow)"/>

  <!-- Subtle Constellation Background Grid & Links -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="80" y1="60" x2="220" y2="110"/>
    <line x1="220" y1="110" x2="160" y2="240"/>
    <line x1="160" y1="240" x2="90" y2="310"/>
    <line x1="220" y1="110" x2="340" y2="70"/>
    <line x1="340" y1="70" x2="420" y2="180"/>
    
    <line x1="1020" y1="80" x2="1110" y2="160"/>
    <line x1="1110" y1="160" x2="1050" y2="280"/>
    <line x1="1050" y1="280" x2="960" y2="220"/>
    <line x1="960" y1="220" x2="880" y2="320"/>
    <line x1="960" y1="220" x2="850" y2="120"/>
    <line x1="850" y1="120" x2="1020" y2="80"/>
  </g>

  <!-- Glowing Constellation Nodes -->
  <g>
    <!-- Left constellation nodes -->
    <circle cx="80" cy="60" r="3" fill="#38bdf8" opacity="0.6"/>
    <circle cx="220" cy="110" r="5" fill="#38bdf8" filter="url(#glowEffect)"/>
    <circle cx="160" cy="240" r="4" fill="#818cf8"/>
    <circle cx="90" cy="310" r="3" fill="#c084fc" opacity="0.7"/>
    <circle cx="340" cy="70" r="3" fill="#38bdf8" opacity="0.5"/>
    <circle cx="420" cy="180" r="4" fill="#818cf8" opacity="0.7"/>

    <!-- Right constellation nodes -->
    <circle cx="1020" cy="80" r="4" fill="#818cf8"/>
    <circle cx="1110" cy="160" r="5" fill="#c084fc" filter="url(#glowEffect)"/>
    <circle cx="1050" cy="280" r="4" fill="#38bdf8"/>
    <circle cx="960" cy="220" r="5" fill="#38bdf8" filter="url(#glowEffect)"/>
    <circle cx="880" cy="320" r="3" fill="#818cf8" opacity="0.6"/>
    <circle cx="850" cy="120" r="4" fill="#c084fc" opacity="0.8"/>
  </g>

  <!-- Floating Logo Symbol (Center-Top) -->
  <g transform="translate(600, 72)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="34" fill="#0f172a" stroke="url(#badgeBorder)" stroke-width="2" filter="url(#glowEffect)"/>
    <!-- Central Prism Lens -->
    <polygon points="0,-18 16,10 -16,10" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Refracted Ray Lines -->
    <line x1="0" y1="-5" x2="14" y2="2" stroke="#818cf8" stroke-width="2"/>
    <line x1="0" y1="-5" x2="20" y2="-8" stroke="#c084fc" stroke-width="2"/>
    <line x1="-22" y1="-5" x2="0" y2="-5" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="-5" r="3" fill="#00f2fe"/>
  </g>

  <!-- Top Category Eyebrow Pill -->
  <g transform="translate(600, 132)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="-116" cy="0" r="4" fill="#00f2fe" filter="url(#glowEffect)"/>
    <text x="5" y="4" text-anchor="middle" class="badge-text">SCIENTIFIC INTELLIGENCE PLATFORM</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="200" text-anchor="middle" class="title-text" fill="url(#titleGrad)" filter="url(#glowEffect)">ResearchLens</text>
  <text x="600" y="200" text-anchor="middle" class="title-text" fill="url(#titleGrad)">ResearchLens</text>

  <!-- Subtitle -->
  <text x="600" y="240" text-anchor="middle" class="subtitle-text">
    Multi-Paper Grounded Inquiry • PyMuPDF Page Citations • Hybrid Dense/Sparse RAG
  </text>

  <!-- Feature & Tech Badges Row -->
  <g transform="translate(600, 305)">
    <!-- Pill 1: Next.js 14 -->
    <g transform="translate(-460, 0)">
      <rect x="0" y="-18" width="135" height="36" rx="18" fill="url(#pillGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="0" r="5" fill="#38bdf8"/>
      <text x="76" y="5" text-anchor="middle" class="pill-text">Next.js 14 App</text>
    </g>

    <!-- Pill 2: FastAPI & PyMuPDF -->
    <g transform="translate(-305, 0)">
      <rect x="0" y="-18" width="155" height="36" rx="18" fill="url(#pillGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="0" r="5" fill="#10b981"/>
      <text x="86" y="5" text-anchor="middle" class="pill-text">FastAPI + PyMuPDF</text>
    </g>

    <!-- Pill 3: pgvector HNSW -->
    <g transform="translate(-130, 0)">
      <rect x="0" y="-18" width="150" height="36" rx="18" fill="url(#pillGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="0" r="5" fill="#818cf8"/>
      <text x="84" y="5" text-anchor="middle" class="pill-text">pgvector HNSW</text>
    </g>

    <!-- Pill 4: Hybrid RAG -->
    <g transform="translate(40, 0)">
      <rect x="0" y="-18" width="150" height="36" rx="18" fill="url(#pillGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="0" r="5" fill="#c084fc"/>
      <text x="84" y="5" text-anchor="middle" class="pill-text">Hybrid Dual-RAG</text>
    </g>

    <!-- Pill 5: Verifiable Citations -->
    <g transform="translate(210, 0)">
      <rect x="0" y="-18" width="165" height="36" rx="18" fill="url(#pillGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="0" r="5" fill="#f59e0b"/>
      <text x="92" y="5" text-anchor="middle" class="pill-text">Verifiable Citations</text>
    </g>

    <!-- Pill 6: Three.js WebGL -->
    <g transform="translate(395, 0)">
      <rect x="0" y="-18" width="145" height="36" rx="18" fill="url(#pillGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="0" r="5" fill="#ec4899"/>
      <text x="80" y="5" text-anchor="middle" class="pill-text">Three.js WebGL</text>
    </g>
  </g>

  <!-- Subtle outer border frame -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>
</svg>