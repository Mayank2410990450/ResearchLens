<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .layer-title { font-size: 13px; font-weight: 700; letter-spacing: 1px; fill: #94a3b8; }
    .box-title { font-size: 14px; font-weight: 600; fill: #f8fafc; }
    .box-desc { font-size: 11px; fill: #94a3b8; line-height: 1.4; }
    .chip-text { font-size: 10px; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="1200" height="600" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="1199" height="599" rx="15.5" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Diagram Title Header -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" class="font-sans" font-size="22px" font-weight="700" fill="#f8fafc">ResearchLens System Architecture</text>
    <text x="0" y="22" class="font-sans" font-size="12px" fill="#64748b">End-to-End Reactive Full-Stack Topology &amp; Grounded RAG Data Pipelines</text>
  </g>

  <!-- Status / Security Badge (Top-Right) -->
  <g transform="translate(980, 32)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#38bdf8" filter="url(#softGlow)"/>
    <text x="88" y="18" text-anchor="middle" class="font-sans" font-size="11px" font-weight="600" fill="#38bdf8">AIR-GAPPED READY</text>
  </g>

  <!-- LAYER 1: CLIENT FRONTEND TIER (Y: 90) -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="1080" height="95" rx="12" fill="#0c1322" stroke="#1e293b" stroke-width="1.2"/>
    <text x="24" y="24" class="font-sans layer-title">TIER 1: PRESENTATION &amp; WORKSPACE (NEXT.JS 14 APP ROUTER)</text>

    <!-- Component 1: 3D Constellation & Landing -->
    <g transform="translate(24, 38)">
      <rect x="0" y="0" width="240" height="44" rx="8" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="22" r="5" fill="#38bdf8"/>
      <text x="32" y="20" class="font-sans box-title" font-size="12px">Three.js WebGL Engine</text>
      <text x="32" y="34" class="font-sans box-desc">Interactive 3D paper network</text>
    </g>

    <!-- Component 2: Split-Screen PDF Reader -->
    <g transform="translate(284, 38)">
      <rect x="0" y="0" width="250" height="44" rx="8" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="22" r="5" fill="#10b981"/>
      <text x="32" y="20" class="font-sans box-title" font-size="12px">Split-Screen PDF Studio</text>
      <text x="32" y="34" class="font-sans box-desc">PyMuPDF bounding box sync</text>
    </g>

    <!-- Component 3: Grounded AI Assistant -->
    <g transform="translate(554, 38)">
      <rect x="0" y="0" width="250" height="44" rx="8" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="22" r="5" fill="#f59e0b"/>
      <text x="32" y="20" class="font-sans box-title" font-size="12px">Grounded AI Chat</text>
      <text x="32" y="34" class="font-sans box-desc">Verifiable quotes &amp; citations</text>
    </g>

    <!-- Component 4: Comparative Matrix Studio -->
    <g transform="translate(824, 38)">
      <rect x="0" y="0" width="232" height="44" rx="8" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="22" r="5" fill="#c084fc"/>
      <text x="32" y="20" class="font-sans box-title" font-size="12px">Synthesis &amp; Matrix</text>
      <text x="32" y="34" class="font-sans box-desc">Cross-paper analysis &amp; gaps</text>
    </g>
  </g>

  <!-- CONNECTOR ARROWS TIER 1 -> TIER 2 -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6">
    <line x1="300" y1="185" x2="300" y2="215"/>
    <line x1="600" y1="185" x2="600" y2="215"/>
    <line x1="900" y1="185" x2="900" y2="215"/>
  </g>
  <text x="600" y="204" text-anchor="middle" class="font-sans font-code" font-size="10px" fill="#38bdf8">REST APIs + Server-Sent Events / WebSockets (JWT Bearer Auth)</text>

  <!-- LAYER 2: FASTAPI APPLICATION GATEWAY & SERVICES (Y: 215) -->
  <g transform="translate(60, 215)">
    <rect x="0" y="0" width="1080" height="105" rx="12" fill="#0c1322" stroke="#1e293b" stroke-width="1.2"/>
    <text x="24" y="24" class="font-sans layer-title">TIER 2: APPLICATION &amp; BUSINESS LOGIC (PYTHON FASTAPI + PYDANTIC V2)</text>

    <!-- Sub-module 1: Auth & User Security -->
    <g transform="translate(24, 38)">
      <rect x="0" y="0" width="240" height="54" rx="8" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" class="font-sans box-title" font-size="12px">Auth &amp; Row-Level Security</text>
      <text x="16" y="38" class="font-sans box-desc">Bcrypt Hash • JWT • Multi-Tenant</text>
    </g>

    <!-- Sub-module 2: Document Ingestion Router -->
    <g transform="translate(284, 38)">
      <rect x="0" y="0" width="250" height="54" rx="8" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" class="font-sans box-title" font-size="12px">Document Ingestion API</text>
      <text x="16" y="38" class="font-sans box-desc">PyMuPDF Text, TOC, Layout, &amp; Box</text>
    </g>

    <!-- Sub-module 3: Grounded Query Engine API -->
    <g transform="translate(554, 38)">
      <rect x="0" y="0" width="250" height="54" rx="8" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" class="font-sans box-title" font-size="12px">RAG Query &amp; Chat Router</text>
      <text x="16" y="38" class="font-sans box-desc">Grounded Prompt Engine • Strict Quotes</text>
    </g>

    <!-- Sub-module 4: Analytics & Comparison Service -->
    <g transform="translate(824, 38)">
      <rect x="0" y="0" width="232" height="54" rx="8" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" class="font-sans box-title" font-size="12px">Matrix &amp; Discovery API</text>
      <text x="16" y="38" class="font-sans box-desc">Cross-Paper Comparison &amp; Gaps</text>
    </g>
  </g>

  <!-- CONNECTOR ARROWS TIER 2 -> TIER 3 -->
  <g stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6">
    <line x1="300" y1="320" x2="300" y2="350"/>
    <line x1="600" y1="320" x2="600" y2="350"/>
    <line x1="900" y1="320" x2="900" y2="350"/>
  </g>
  <text x="600" y="339" text-anchor="middle" class="font-sans font-code" font-size="10px" fill="#10b981">Dual Ingestion &amp; Hybrid Vector Index Pipelines</text>

  <!-- LAYER 3: RAG INTELLIGENCE & PIPELINE ENGINE (Y: 350) -->
  <g transform="translate(60, 350)">
    <rect x="0" y="0" width="1080" height="105" rx="12" fill="#0c1322" stroke="#1e293b" stroke-width="1.2"/>
    <text x="24" y="24" class="font-sans layer-title">TIER 3: GROUNDED RAG INTELLIGENCE &amp; SEMANTIC ENGINE</text>

    <!-- Component 1: PyMuPDF Chunking Engine -->
    <g transform="translate(24, 38)">
      <rect x="0" y="0" width="240" height="54" rx="8" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" class="font-sans box-title" font-size="12px">Page-Aware Chunking</text>
      <text x="16" y="38" class="font-sans box-desc">500 tokens • 100 overlap • Page tags</text>
    </g>

    <!-- Component 2: 384-d Dense Embedding -->
    <g transform="translate(284, 38)">
      <rect x="0" y="0" width="250" height="54" rx="8" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" class="font-sans box-title" font-size="12px">Dense Embeddings (384-d)</text>
      <text x="16" y="38" class="font-sans box-desc">Semantic vector space • MiniLM-L6</text>
    </g>

    <!-- Component 3: BM25 Lexical Inverted Index -->
    <g transform="translate(554, 38)">
      <rect x="0" y="0" width="250" height="54" rx="8" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" class="font-sans box-title" font-size="12px">Sparse BM25 Index</text>
      <text x="16" y="38" class="font-sans box-desc">Exact keyword &amp; formula lookup</text>
    </g>

    <!-- Component 4: Hybrid Reranker & Citation Anchor -->
    <g transform="translate(824, 38)">
      <rect x="0" y="0" width="232" height="54" rx="8" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" class="font-sans box-title" font-size="12px">Hybrid Re-ranker (α=0.7)</text>
      <text x="16" y="38" class="font-sans box-desc">Score synthesis &amp; verified anchors</text>
    </g>
  </g>

  <!-- CONNECTOR ARROWS TIER 3 -> TIER 4 -->
  <g stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6">
    <line x1="400" y1="455" x2="400" y2="485"/>
    <line x1="800" y1="455" x2="800" y2="485"/>
  </g>
  <text x="600" y="474" text-anchor="middle" class="font-sans font-code" font-size="10px" fill="#c084fc">SQLAlchemy 2.0 ORM • pgvector Vector Distance Queries</text>

  <!-- LAYER 4: DATABASE & PERSISTENCE TIER (Y: 485) -->
  <g transform="translate(60, 485)">
    <rect x="0" y="0" width="1080" height="85" rx="12" fill="#0c1322" stroke="#1e293b" stroke-width="1.2"/>
    <text x="24" y="24" class="font-sans layer-title">TIER 4: PERSISTENCE &amp; STORAGE (POSTGRESQL 16 + PGVECTOR)</text>

    <!-- DB Block 1: pgvector HNSW Table -->
    <g transform="translate(24, 34)">
      <rect x="0" y="0" width="330" height="40" rx="6" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="20" r="4" fill="#38bdf8"/>
      <text x="28" y="24" class="font-sans" font-size="11.5px" font-weight="600" fill="#f8fafc">pgvector HNSW Cosine Index</text>
      <text x="210" y="24" class="font-code" font-size="10.5px" fill="#94a3b8">embeddings_384d</text>
    </g>

    <!-- DB Block 2: Relational Metadata Tables -->
    <g transform="translate(374, 34)">
      <rect x="0" y="0" width="340" height="40" rx="6" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="20" r="4" fill="#10b981"/>
      <text x="28" y="24" class="font-sans" font-size="11.5px" font-weight="600" fill="#f8fafc">Relational Schema &amp; Isolation</text>
      <text x="210" y="24" class="font-code" font-size="10.5px" fill="#94a3b8">users, papers, notes</text>
    </g>

    <!-- DB Block 3: Binary Storage Vault -->
    <g transform="translate(734, 34)">
      <rect x="0" y="0" width="322" height="40" rx="6" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="20" r="4" fill="#f59e0b"/>
      <text x="28" y="24" class="font-sans" font-size="11.5px" font-weight="600" fill="#f8fafc">Local / Supabase Storage</text>
      <text x="180" y="24" class="font-code" font-size="10.5px" fill="#94a3b8">raw_pdfs / artifacts</text>
    </g>
  </g>
</svg>