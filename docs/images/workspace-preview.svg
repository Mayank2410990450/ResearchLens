<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- UI Surface Gradients -->
    <linearGradient id="sidebarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#090d17"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131c31"/>
      <stop offset="100%" stop-color="#0e1626"/>
    </linearGradient>

    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141d33"/>
      <stop offset="100%" stop-color="#0e1526"/>
    </linearGradient>

    <!-- Accent Highlights -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="badgeAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .text-dim { fill: #64748b; font-size: 11px; }
    .text-body { fill: #94a3b8; font-size: 12px; }
    .text-bright { fill: #f1f5f9; font-size: 13px; font-weight: 500; }
    .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
  </style>

  <!-- Outer Frame Shadow & Window Shell -->
  <rect width="1200" height="680" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="1199" height="679" rx="15.5" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Browser/Window Header -->
  <rect x="0" y="0" width="1200" height="44" rx="16" fill="#0b1120"/>
  <rect x="0" y="32" width="1200" height="12" fill="#0b1120"/>
  <line x1="0" y1="44" x2="1200" y2="44" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="22" r="6" fill="#ef4444"/>
  <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="22" r="6" fill="#10b981"/>

  <!-- Address Bar / Status -->
  <rect x="110" y="10" width="460" height="24" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <circle cx="125" cy="22" r="3" fill="#10b981"/>
  <text x="136" y="26" class="font-sans text-code" fill="#94a3b8">https://researchlens.local/workspace • Attention Is All You Need</text>

  <!-- Workspace Controls (Right) -->
  <rect x="1000" y="10" width="80" height="24" rx="6" fill="#1e293b"/>
  <text x="1040" y="26" text-anchor="middle" class="font-sans text-dim" fill="#cbd5e1">⌘K Search</text>
  <rect x="1090" y="10" width="90" height="24" rx="6" fill="#0284c7" opacity="0.8"/>
  <text x="1135" y="26" text-anchor="middle" class="font-sans" font-size="11px" font-weight="600" fill="#ffffff">+ Upload PDF</text>

  <!-- MAIN BODY LAYOUT: 3 COLUMNS -->
  <!-- 1. LEFT NARROW ICON SIDEBAR (56px) -->
  <rect x="0" y="44" width="56" height="636" fill="url(#sidebarGrad)"/>
  <line x1="56" y1="44" x2="56" y2="680" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Sidebar Icons -->
  <g transform="translate(18, 64)">
    <!-- Active Papers Icon -->
    <rect x="-4" y="-4" width="28" height="28" rx="6" fill="#0284c7" opacity="0.2"/>
    <rect x="0" y="0" width="20" height="20" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="4" y1="5" x2="16" y2="5" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="4" y1="10" x2="16" y2="10" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="4" y1="15" x2="12" y2="15" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <g transform="translate(18, 114)">
    <!-- 3D Constellation Icon -->
    <circle cx="10" cy="10" r="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="6" cy="7" r="2" fill="#64748b"/>
    <circle cx="14" cy="13" r="2" fill="#64748b"/>
  </g>
  <g transform="translate(18, 164)">
    <!-- Matrix Icon -->
    <rect x="1" y="1" width="18" height="18" rx="2" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="10" y1="1" x2="10" y2="19" stroke="#64748b" stroke-width="1"/>
    <line x1="1" y1="10" x2="19" y2="10" stroke="#64748b" stroke-width="1"/>
  </g>
  <g transform="translate(18, 214)">
    <!-- Notes Icon -->
    <rect x="2" y="1" width="16" height="18" rx="2" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="5" y1="6" x2="13" y2="6" stroke="#64748b" stroke-width="1"/>
    <line x1="5" y1="10" x2="11" y2="10" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- 2. MIDDLE COLUMN: INTERACTIVE SPLIT-SCREEN PDF VIEWER (560px) -->
  <g transform="translate(56, 44)">
    <!-- PDF Viewer Subheader Bar -->
    <rect x="0" y="0" width="564" height="42" fill="#0f172a"/>
    <line x1="0" y1="42" x2="564" y2="42" stroke="#1e293b" stroke-width="1"/>

    <!-- Document Info & Page Controls -->
    <text x="16" y="25" class="font-sans text-bright">Attention Is All You Need.pdf</text>
    <rect x="240" y="10" width="70" height="22" rx="4" fill="#1e293b"/>
    <text x="275" y="25" text-anchor="middle" class="font-sans text-code" fill="#cbd5e1">Page 4 / 15</text>
    
    <!-- Zoom & Sync Status -->
    <rect x="320" y="10" width="46" height="22" rx="4" fill="#1e293b"/>
    <text x="343" y="25" text-anchor="middle" class="font-sans text-code" fill="#cbd5e1">125%</text>

    <rect x="380" y="10" width="170" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="392" cy="21" r="3" fill="#10b981"/>
    <text x="402" y="25" class="font-sans" font-size="10.5px" font-weight="600" fill="#6ee7b7">CITATIONS SYNC ACTIVE</text>

    <!-- PDF Page Canvas Mockup -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="524" height="550" rx="8" fill="url(#pdfGrad)" stroke="#1e293b" stroke-width="1"/>

      <!-- Paper Title & Meta in Document -->
      <text x="30" y="36" class="font-sans" font-size="14px" font-weight="700" fill="#f8fafc">3.2 Scaled Dot-Product Attention</text>
      
      <!-- Paragraph 1 lines -->
      <line x1="30" y1="56" x2="494" y2="56" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
      <line x1="30" y1="72" x2="480" y2="72" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
      <line x1="30" y1="88" x2="460" y2="88" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
      <line x1="30" y1="104" x2="380" y2="104" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

      <!-- ACTIVE HIGHLIGHT BOUNDING BOX (Synced with Right Pane Citation) -->
      <rect x="22" y="128" width="480" height="110" rx="6" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 2"/>
      
      <!-- Highlight Label Tag -->
      <g transform="translate(385, 120)">
        <rect x="0" y="0" width="115" height="18" rx="3" fill="#f59e0b"/>
        <text x="57" y="12" text-anchor="middle" class="font-sans" font-size="9.5px" font-weight="700" fill="#000000">ANCHOR #1 • PAGE 4</text>
      </g>

      <!-- Highlighted Text Content -->
      <text x="34" y="152" class="font-sans" font-size="11.5px" font-weight="500" fill="#fde68a">"We compute the attention function on a set of queries simultaneously,"</text>
      <text x="34" y="172" class="font-sans" font-size="11.5px" font-weight="500" fill="#fde68a">"packed together into a matrix Q. The keys and values are packed into K and V."</text>
      <text x="34" y="196" class="font-sans text-code" font-size="12px" font-weight="700" fill="#38bdf8">Attention(Q, K, V) = softmax(Q K^T / sqrt(d_k)) V</text>
      <text x="34" y="222" class="font-sans" font-size="11px" font-style="italic" fill="#cbd5e1">"The two most commonly used attention functions are additive attention and dot-product attention..."</text>

      <!-- Subsequent Paragraph lines -->
      <line x1="30" y1="260" x2="494" y2="260" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
      <line x1="30" y1="276" x2="470" y2="276" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
      <line x1="30" y1="292" x2="490" y2="292" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
      <line x1="30" y1="308" x2="350" y2="308" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

      <!-- Document Page Number Badge -->
      <text x="262" y="525" text-anchor="middle" class="font-sans text-code" fill="#64748b">- 4 -</text>
    </g>
  </g>
  <line x1="620" y1="44" x2="620" y2="680" stroke="#1e293b" stroke-width="1"/>

  <!-- 3. RIGHT COLUMN: GROUNDED AI RESEARCH ASSISTANT (580px) -->
  <g transform="translate(620, 44)">
    <!-- Chat Header Bar -->
    <rect x="0" y="0" width="580" height="42" fill="#0f172a"/>
    <line x1="0" y1="42" x2="580" y2="42" stroke="#1e293b" stroke-width="1"/>

    <circle cx="22" cy="21" r="5" fill="#38bdf8" filter="url(#softGlow)"/>
    <text x="36" y="25" class="font-sans text-bright">AI Research Assistant</text>

    <!-- RAG Confidence Rating & Mode Pill -->
    <rect x="360" y="10" width="105" height="22" rx="11" fill="#13271c" stroke="#15803d" stroke-width="1"/>
    <text x="412" y="25" text-anchor="middle" class="font-sans" font-size="10.5px" font-weight="600" fill="#4ade80">98.4% Confidence</text>

    <rect x="475" y="10" width="90" height="22" rx="11" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <text x="520" y="25" text-anchor="middle" class="font-sans" font-size="10.5px" font-weight="600" fill="#a5b4fc">Grounded RAG</text>

    <!-- Chat Messages Flow Area -->
    <g transform="translate(20, 58)">
      <!-- USER MESSAGE BUBBLE -->
      <g transform="translate(100, 0)">
        <rect x="0" y="0" width="440" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="16" y="22" class="font-sans" font-size="12px" fill="#f8fafc">Why does the paper scale dot-product attention by</text>
        <text x="16" y="38" class="font-sans text-code" font-weight="600" fill="#38bdf8">1 / sqrt(d_k)</text>
        <text x="105" y="38" class="font-sans" font-size="12px" fill="#f8fafc">instead of standard dot-product?</text>
      </g>

      <!-- AI ASSISTANT RESPONSE BUBBLE -->
      <g transform="translate(0, 68)">
        <rect x="0" y="0" width="540" height="425" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>

        <!-- Assistant Header -->
        <circle cx="24" cy="24" r="8" fill="#0284c7" opacity="0.3"/>
        <circle cx="24" cy="24" r="4" fill="#38bdf8"/>
        <text x="42" y="28" class="font-sans" font-size="12.5px" font-weight="600" fill="#38bdf8">ResearchLens RAG Engine</text>
        <text x="450" y="28" class="font-sans text-dim">Synthesized 0.18s</text>

        <!-- Structured Explanation -->
        <text x="24" y="56" class="font-sans text-body">According to <tspan font-weight="700" fill="#f1f5f9">Section 3.2 (Page 4)</tspan>, the scaling factor is introduced to</text>
        <text x="24" y="74" class="font-sans text-body">counteract vanishing gradients during softmax computation for high dimensions:</text>

        <!-- Bullet Point 1 -->
        <circle cx="32" cy="100" r="2.5" fill="#38bdf8"/>
        <text x="44" y="104" class="font-sans text-bright" font-size="12px">Magnitude Growth in Large Dimensions:</text>
        <text x="44" y="122" class="font-sans text-body">For large values of <tspan font-family="monospace" fill="#38bdf8">d_k</tspan>, dot products grow exceedingly large in magnitude.</text>

        <!-- Bullet Point 2 -->
        <circle cx="32" cy="148" r="2.5" fill="#f59e0b"/>
        <text x="44" y="152" class="font-sans text-bright" font-size="12px">Softmax Gradient Saturation:</text>
        <text x="44" y="170" class="font-sans text-body">Large values push the softmax function into regions with extremely small</text>
        <text x="44" y="186" class="font-sans text-body">derivatives (the vanishing gradient problem).</text>

        <!-- VERIFIED CITATION CARD (CLICKABLE) -->
        <g transform="translate(24, 206)">
          <rect x="0" y="0" width="492" height="130" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>

          <!-- Citation Header -->
          <rect x="12" y="12" width="130" height="20" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
          <text x="77" y="26" text-anchor="middle" class="font-sans" font-size="10.5px" font-weight="700" fill="#f59e0b">VERIFIED CITATION #1</text>

          <text x="154" y="26" class="font-sans text-code" fill="#94a3b8">Page 4 • Section 3.2 • Cosine: 0.941</text>
          
          <!-- Jump to Page Button Inside Citation -->
          <rect x="390" y="10" width="90" height="22" rx="4" fill="#0284c7"/>
          <text x="435" y="25" text-anchor="middle" class="font-sans" font-size="10px" font-weight="600" fill="#ffffff">Jump to Page 4 ↗</text>

          <!-- Direct Verified Paper Quotation -->
          <text x="16" y="56" class="font-sans" font-size="11.5px" font-style="italic" fill="#f8fafc">
            "To illustrate why the dot products get large, assume that the components of q and k
          </text>
          <text x="16" y="74" class="font-sans" font-size="11.5px" font-style="italic" fill="#f8fafc">
            are independent random variables with mean 0 and variance 1. Then their dot product
          </text>
          <text x="16" y="92" class="font-sans" font-size="11.5px" font-style="italic" fill="#f8fafc">
            has mean 0 and variance d_k. To counteract this effect, we scale by 1 / sqrt(d_k)."
          </text>

          <!-- Verification Badge Footer -->
          <circle cx="20" cy="116" r="3" fill="#10b981"/>
          <text x="30" y="119" class="font-sans text-code" fill="#10b981">Exact text span verified against PyMuPDF page-coordinate extraction.</text>
        </g>

        <!-- User Follow-up Action Suggestions -->
        <g transform="translate(24, 354)">
          <text x="0" y="16" class="font-sans text-dim">SUGGESTED SCIENTIFIC INQUIRIES:</text>
          
          <rect x="0" y="26" width="220" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="110" y="42" text-anchor="middle" class="font-sans text-dim" fill="#e2e8f0">Compare with Multi-Head Attention</text>

          <rect x="230" y="26" width="240" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="350" y="42" text-anchor="middle" class="font-sans text-dim" fill="#e2e8f0">View Experimental BLEU Benchmarks</text>
        </g>
      </g>
    </g>

    <!-- Bottom Chat Input Bar -->
    <g transform="translate(20, 574)">
      <rect x="0" y="0" width="540" height="46" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
      <text x="16" y="28" class="font-sans" font-size="12px" fill="#64748b">Ask any question about methodology, formulas, or datasets...</text>
      <rect x="470" y="8" width="58" height="30" rx="6" fill="#0284c7"/>
      <text x="499" y="27" text-anchor="middle" class="font-sans" font-size="11.5px" font-weight="600" fill="#ffffff">Send ↵</text>
    </g>
  </g>
</svg>